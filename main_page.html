<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wedding Invitation - Ismail & Yara</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* 1. RESET & FULL SCREEN */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f5f2e9; /* Matching cream backup color */
        }

        body {
            /* 2. THE BACKGROUND FIX */
            background-image: url('background.png') !important;
            background-repeat: no-repeat !important;
            /* 'cover' ensures the screen is always 100% full */
            background-size: cover !important; 
            background-position: center center !important;
            
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 3. ENVELOPE SCALING */
        .envelope-wrapper {
            position: relative;
            cursor: pointer;
            z-index: 10;
            /* This scale works best for most Desktop screens */
            transform: scale(0.85);
            transition: transform 0.3s ease;
        }

        /* 4. MOBILE SPECIFIC OPTIMIZATION */
        @media (max-width: 600px) {
            body {
                /* Adjusting background for narrow phone screens */
                background-position: center center !important;
                background-size: cover !important;
            }

            .envelope-wrapper {
                /* Makes envelope smaller so you see more flowers on mobile */
                transform: scale(0.55); 
            }
            
            /* Prevents the invite text from being too small on phones */
            .invitation-card {
                padding: 20px;
            }
        }

        /* Optional: Add a smooth fade-in for a professional feel */
        body {
            animation: fadeInPage 1.2s ease-in-out;
        }
        @keyframes fadeInPage {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="envelope-wrapper" id="envelopeWrapper">
        
        <!-- Invitation Card -->
        <div class="invitation-card">
            <div class="avatar-circle">
                <img src="heart.png" alt="♥" style="width: 40px; height: 40px;" onerror="this.src='https://cdn-icons-png.flaticon.com/512/833/833472.png'">
            </div>

            <h1 class="name">ISMAIL</h1>
            <span class="and-text">&</span>
            <h1 class="name">YARA</h1>

            <div class="elegant-line"></div>

            <p class="wedding-date">September 04, 2026</p>
            <p class="invite-text">cordially invite.</p>

            <a href="details.html" class="open-btn">Open</a>
        </div>

        <!-- 3D Envelope Base -->
        <div class="envelope">
            <div class="flap"></div>
            <div class="pocket"></div>
            <div class="wax-seal" id="waxSeal">
                <span style="font-size: 25px; color: white; display: block; margin-top: -2px;">♥</span>
            </div>
        </div>

    </div>

    <script>
        const waxSeal = document.getElementById('waxSeal');
        const envelopeWrapper = document.getElementById('envelopeWrapper');

        waxSeal.addEventListener('click', (e) => {
            e.stopPropagation();
            envelopeWrapper.classList.add('open');
        });

        window.addEventListener('load', () => {
            let guestName = localStorage.getItem('wedding_guest_name');
            if (!guestName) {
                guestName = prompt("Please enter your name to view the invitation:");
                if (guestName && guestName.trim() !== "") {
                    localStorage.setItem('wedding_guest_name', guestName);
                }
            }
        });
    </script>
</body>
</html>
