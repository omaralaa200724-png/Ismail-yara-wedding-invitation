<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wedding Invitation - Ismail & Yara</title>
    
    <!-- Link to your 3D animations -->
    <link rel="stylesheet" href="style.css">
    
    <style>
    /* 1. GLOBAL RESET */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; width: 100%; height: 100%; }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        background-color: #fdfaf3;
    }

    /* 2. PC BACKGROUND */
    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("background.png");
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        z-index: -1;
    }

    /* 3. ENVELOPE BASE (PC) */
    .envelope-wrapper {
        position: relative;
        cursor: pointer;
        z-index: 10;
        transform: scale(0.85);
        transition: transform 0.3s ease;
    }

    /* 4. MOBILE FIX - SNAP EVERYTHING TOGETHER */
    @media screen and (max-width: 768px) {
        body::before {
            background-image: url("mobile-background.png") !important;
            background-position: center top !important;
        }

        /* Forces the container to be the right size */
        .envelope-wrapper {
            width: 360px !important;
            height: 200px !important;
            transform: scale(0.65) translateY(60px) !important;
            display: block !important;
        }

        .envelope {
            position: absolute !important;
            top: 0;
            left: 0;
            width: 360px !important;
            height: 200px !important;
            background-color: #2c3e50 !important; /* The base color */
        }

        /* TOP FLAP */
        .flap {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            z-index: 4 !important;
            border-left: 180px solid transparent !important;
            border-right: 180px solid transparent !important;
            border-top: 110px solid #242f3f !important; /* Flap Triangle */
            transform-origin: top !important;
        }

        /* BOTTOM POCKET */
        .pocket {
            position: absolute !important;
            bottom: 0 !important;
            left: 0 !important;
            z-index: 3 !important;
            border-left: 180px solid #2c3e50 !important;
            border-right: 180px solid #2c3e50 !important;
            border-bottom: 100px solid #1a252f !important;
            border-top: 100px solid transparent !important;
        }

        /* THE CARD (Hidden inside) */
        .invitation-card {
            position: absolute !important;
            bottom: 5px !important;
            left: 10px !important;
            width: 340px !important;
            height: 185px !important;
            z-index: 2 !important; /* Behind flap and pocket */
            background: white !important;
            padding: 15px !important;
            margin: 0 !important;
            transition: transform 0.6s ease !important;
        }

        /* Card Content Scaling */
        .invitation-card .name { font-size: 22px !important; line-height: 1.2 !important; }
        .invitation-card .avatar-circle { width: 35px !important; height: 35px !important; margin: 0 auto 5px !important; }
        .invitation-card .open-btn { margin-top: 10px !important; padding: 5px 15px !important; }

        /* WAX SEAL POSITION */
        .wax-seal {
            position: absolute !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            top: 85px !important; /* Sits exactly on the flap tip */
            z-index: 5 !important;
            width: 40px !important;
            height: 40px !important;
        }

        /* Animation when opened */
        .envelope-wrapper.open .invitation-card {
            transform: translateY(-120px) !important; /* Pops up */
            z-index: 5 !important;
        }
        
        .envelope-wrapper.open .flap {
            transform: rotateX(180deg) !important;
            z-index: 1 !important;
        }
    }

    body { animation: fadeInPage 1.2s ease-in-out; }
    @keyframes fadeInPage { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

    <div class="envelope-wrapper" id="envelopeWrapper">
        
        <!-- Invitation Card -->
        <div class="invitation-card">
            <div class="avatar-circle">
                <img src="heart.png" alt="♥" style="width: 30px; height: 30px;" onerror="this.src='https://cdn-icons-png.flaticon.com/512/833/833472.png'">
            </div>

            <h1 class="name">ISMAIL</h1>
            <span class="and-text">&</span>
            <h1 class="name">YARA</h1>

            <div class="elegant-line"></div>
            <p class="wedding-date">September 04, 2026</p>
            <p class="invite-text">cordially invite.</p>

            <a href="details.html" class="open-btn">Open</a>
        </div>

        <!-- 3D Envelope Base -->
        <div class="envelope">
            <div class="flap"></div>
            <div class="pocket"></div>
            <div class="wax-seal" id="waxSeal">
                <span style="font-size: 22px; color: white;">♥</span>
            </div>
        </div>

    </div>

    <script>
        const waxSeal = document.getElementById('waxSeal');
        const envelopeWrapper = document.getElementById('envelopeWrapper');

        // Toggle Open State
        waxSeal.addEventListener('click', (e) => {
            e.stopPropagation();
            envelopeWrapper.classList.add('open');
        });

        // Prompt for guest name
        window.addEventListener('load', () => {
            let guestName = localStorage.getItem('wedding_guest_name');
            if (!guestName) {
                guestName = prompt("Please enter your name to view the invitation:");
                if (guestName && guestName.trim() !== "") {
                    localStorage.setItem('wedding_guest_name', guestName);
                }
            }
        });
    </script>
</body>
</html>
