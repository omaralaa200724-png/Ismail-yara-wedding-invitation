<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wedding Invitation - Ismail & Yara</title>
    
    <!-- Your original style.css -->
    <link rel="stylesheet" href="style.css">
    
    <style>
    /* 1. GLOBAL RESET */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; width: 100%; height: 100%; }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        background-color: #fdfaf3;
    }

    /* 2. PC BACKGROUND */
    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("background.png");
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        z-index: -1;
    }

    /* 3. PC ENVELOPE (Kept original as requested) */
    .envelope-wrapper {
        position: relative;
        cursor: pointer;
        z-index: 10;
        transform: scale(0.85);
        transition: transform 0.3s ease;
    }

    /* 4. MOBILE FIX - RECTANGULAR ENVELOPE & LARGE CARD */
    @media screen and (max-width: 768px) {
        body::before {
            background-image: url("mobile-background.png") !important;
            background-position: center top !important;
        }

        /* Set container size for rectangle */
        .envelope-wrapper {
            width: 350px !important;
            height: 190px !important; /* Shorter for better look */
            transform: scale(0.75) translateY(40px) !important;
            display: block !important;
        }

        .envelope {
            position: absolute !important;
            top: 0;
            left: 0;
            width: 350px !important;
            height: 190px !important;
            background-color: #2c3e50 !important;
        }

        /* TOP FLAP (Matching 350px width) */
        .flap {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            z-index: 4 !important;
            border-left: 175px solid transparent !important;
            border-right: 175px solid transparent !important;
            border-top: 100px solid #242f3f !important;
            transform-origin: top !important;
        }

        /* BOTTOM POCKET */
        .pocket {
            position: absolute !important;
            bottom: 0 !important;
            left: 0 !important;
            z-index: 3 !important;
            border-left: 175px solid #2c3e50 !important;
            border-right: 175px solid #2c3e50 !important;
            border-bottom: 90px solid #1a252f !important;
            border-top: 90px solid transparent !important;
        }

        /* --- THE FIXED INVITATION CARD --- */
        .invitation-card {
            position: absolute !important;
            bottom: 10px !important; /* Hidden deep inside pocket */
            left: 10px !important;
            width: 330px !important;
            height: 260px !important; /* Tall card so names have space */
            z-index: 2 !important;
            background: white !important;
            padding: 25px 15px !important;
            margin: 0 !important;
            border-radius: 15px !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            transition: transform 0.8s ease !important;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.1) !important;
        }

        /* Fixing fonts inside the card for mobile */
        .invitation-card h1.name {
            font-size: 22px !important;
            margin: 5px 0 !important;
            line-height: 1.2 !important;
        }
        .invitation-card .avatar-circle {
            width: 45px !important;
            height: 45px !important;
            margin-bottom: 10px !important;
        }
        .invitation-card .open-btn {
            margin-top: 15px !important;
            padding: 8px 30px !important;
            font-size: 13px !important;
        }

        /* WAX SEAL (Red Heart) */
        .wax-seal {
            position: absolute !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            top: 75px !important; /* Sits on flap tip */
            z-index: 5 !important;
        }

        /* OPEN ANIMATION */
        .envelope-wrapper.open .invitation-card {
            transform: translateY(-170px) !important; /* Card pops out high */
            z-index: 5 !important;
        }
        
        .envelope-wrapper.open .flap {
            transform: rotateX(180deg) !important;
            z-index: 1 !important;
        }
    }

    body { animation: fadeInPage 1.2s ease-in-out; }
    @keyframes fadeInPage { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

    <div class="envelope-wrapper" id="envelopeWrapper">
        
        <!-- Invitation Card Content (Old way, no inline font sizes) -->
        <div class="invitation-card">
            <div class="avatar-circle">
                <img src="heart.png" alt="♥" style="width: 40px; height: 40px;" onerror="this.src='https://cdn-icons-png.flaticon.com/512/833/833472.png'">
            </div>
            <h1 class="name">ISMAIL</h1>
            <span class="and-text">&</span>
            <h1 class="name">YARA</h1>
            <div class="elegant-line"></div>
            <p class="wedding-date">September 04, 2026</p>
            <p class="invite-text">cordially invite.</p>
            <a href="details.html" class="open-btn">Open</a>
        </div>

        <!-- Envelope Structure -->
        <div class="envelope">
            <div class="flap"></div>
            <div class="pocket"></div>
            <div class="wax-seal" id="waxSeal">
                <span style="font-size: 25px; color: white;">♥</span>
            </div>
        </div>

    </div>

    <script>
        const waxSeal = document.getElementById('waxSeal');
        const envelopeWrapper = document.getElementById('envelopeWrapper');

        waxSeal.addEventListener('click', (e) => {
            e.stopPropagation();
            envelopeWrapper.classList.add('open');
        });

        window.addEventListener('load', () => {
            let guestName = localStorage.getItem('wedding_guest_name');
            if (!guestName) {
                guestName = prompt("Please enter your name to view the invitation:");
                if (guestName) localStorage.setItem('wedding_guest_name', guestName.trim());
            }
        });
    </script>
</body>
</html>
