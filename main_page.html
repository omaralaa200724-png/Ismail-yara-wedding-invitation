<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wedding Invitation - Ismail & Yara</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* 1. PROFESSIONAL MOBILE RESET */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        html, body {
            overflow: hidden; /* Prevents unwanted scrolling on the landing page */
            width: 100%;
            height: 100%;
        }

        body {
            /* 2. THE BACKGROUND FIX (From your details code) */
            background-image: url('background.png') !important;
            background-repeat: no-repeat !important;
            background-size: cover !important;
            background-position: center center !important;
            
            /* Ensures it works on all mobile screens including iPhones */
            min-height: 100vh;
            min-height: 100dvh; 
            
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f2e9; /* Backup color */
        }

        /* 3. ENVELOPE SCALING FOR MOBILE */
        .envelope-wrapper {
            position: relative;
            cursor: pointer;
            z-index: 10;
            /* Default for Desktop */
            transform: scale(0.85); 
            transition: transform 0.3s ease;
        }

        /* MOBILE SPECIFIC ADJUSTMENTS */
        @media screen and (max-width: 768px) {
            body {
                /* Shifts background up slightly on mobile to show the top flowers better */
                background-position: center top !important;
            }

            .envelope-wrapper {
                /* REDUCED SCALE: This makes the envelope look "good" on small screens 
                   without covering the background flowers */
                transform: scale(0.58) translateY(20px); 
            }
        }

        /* Support for very small phones */
        @media screen and (max-width: 380px) {
            .envelope-wrapper {
                transform: scale(0.5);
            }
        }

        /* Fade-in effect when the page opens */
        body {
            animation: fadeInPage 1s ease-in-out;
        }
        @keyframes fadeInPage {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="envelope-wrapper" id="envelopeWrapper">
        
        <!-- Invitation Card -->
        <div class="invitation-card">
            <div class="avatar-circle">
                <img src="heart.png" alt="♥" style="width: 40px; height: 40px;" onerror="this.src='https://cdn-icons-png.flaticon.com/512/833/833472.png'">
            </div>

            <h1 class="name">ISMAIL</h1>
            <span class="and-text">&</span>
            <h1 class="name">YARA</h1>

            <div class="elegant-line"></div>

            <p class="wedding-date">September 04, 2026</p>
            <p class="invite-text">cordially invite.</p>

            <a href="details.html" class="open-btn">Open</a>
        </div>

        <!-- 3D Envelope Base -->
        <div class="envelope">
            <div class="flap"></div>
            <div class="pocket"></div>
            <div class="wax-seal" id="waxSeal">
                <span style="font-size: 25px; color: white; display: block; margin-top: -2px;">♥</span>
            </div>
        </div>

    </div>

    <script>
        const waxSeal = document.getElementById('waxSeal');
        const envelopeWrapper = document.getElementById('envelopeWrapper');

        waxSeal.addEventListener('click', (e) => {
            e.stopPropagation();
            envelopeWrapper.classList.add('open');
        });

        // Prompt for guest name
        window.addEventListener('load', () => {
            let guestName = localStorage.getItem('wedding_guest_name');
            if (!guestName) {
                guestName = prompt("Please enter your name to view the invitation:");
                if (guestName && guestName.trim() !== "") {
                    localStorage.setItem('wedding_guest_name', guestName);
                }
            }
        });
    </script>
</body>
</html>
