<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wedding Invitation - Ismail & Yara</title>
    
    <!-- We load your style.css first -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* This section FORCES the floral image to appear and removes the blue gradient */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            height: 100% !important;
            overflow: hidden !important;
        }

        body {
            /* 1. This line overrides the blue gradient from style.css */
            background-image: url("background.png") !important; 
            background-size: cover !important;
            background-position: center center !important;
            background-repeat: no-repeat !important;
            
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            min-height: 100dvh !important;
        }

        /* PC Scaling */
        .envelope-wrapper {
            position: relative;
            z-index: 10;
            transform: scale(0.85);
        }

        /* Mobile Fix */
        @media screen and (max-width: 768px) {
            body {
                /* Use your vertical mobile image here */
                background-image: url("mobile-background.png") !important;
                background-position: center top !important;
            }
            .envelope-wrapper {
                transform: scale(0.58) translateY(30px);
            }
        }
    </style>
</head>
<body>

    <div class="envelope-wrapper" id="envelopeWrapper">
        <!-- ... (Invitation Card Content) ... -->
        <div class="invitation-card">
            <div class="avatar-circle">
                <img src="heart.png" alt="♥" style="width: 40px; height: 40px;" onerror="this.src='https://cdn-icons-png.flaticon.com/512/833/833472.png'">
            </div>
            <h1 class="name">ISMAIL</h1>
            <span class="and-text">&</span>
            <h1 class="name">YARA</h1>
            <div class="elegant-line"></div>
            <p class="wedding-date">September 04, 2026</p>
            <p class="invite-text">cordially invite.</p>
            <a href="details.html" class="open-btn">Open</a>
        </div>

        <div class="envelope">
            <div class="flap"></div>
            <div class="pocket"></div>
            <div class="wax-seal" id="waxSeal">
                <span style="font-size: 25px; color: white;">♥</span>
            </div>
        </div>
    </div>

    <script>
        const waxSeal = document.getElementById('waxSeal');
        const envelopeWrapper = document.getElementById('envelopeWrapper');
        waxSeal.addEventListener('click', (e) => {
            e.stopPropagation();
            envelopeWrapper.classList.add('open');
        });
    </script>
</body>
</html>
