<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wedding Invitation - Ismail & Yara</title>
    
    <!-- Link to your 3D animations -->
    <link rel="stylesheet" href="style.css">
    
    <style>
    /* 1. GLOBAL RESET */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; width: 100%; height: 100%; }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        background-color: #fdfaf3;
    }

    /* 2. PC BACKGROUND */
    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("background.png");
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        z-index: -1;
    }

    /* 3. ENVELOPE BASE (PC) */
    .envelope-wrapper {
        position: relative;
        cursor: pointer;
        z-index: 10;
        transform: scale(0.85);
        transition: transform 0.3s ease;
    }

     @media screen and (max-width: 768px) {
        body {
            background-image: url("mobile-background.png") !important;
            background-position: center top !important;
        }

        /* 1. MAKE ENVELOPE RECTANGULAR ON MOBILE */
        .envelope {
            width: 350px !important;  /* Make it wider */
            height: 200px !important; /* Make it shorter */
        }

        /* 2. ADJUST THE FLAP (The top triangle) */
        .flap {
            border-left: 175px solid transparent !important; /* Half of new width */
            border-right: 175px solid transparent !important; /* Half of new width */
            border-top: 110px solid #2c3e50 !important; /* Adjust height of triangle */
        }

        /* 3. ADJUST THE POCKET (The bottom part) */
        .pocket {
            border-left: 175px solid #2c3e50 !important;
            border-right: 175px solid #2c3e50 !important;
            border-bottom: 100px solid #1a252f !important;
            border-top: 100px solid transparent !important;
        }

        /* 4. ADJUST THE CARD INSIDE */
        .invitation-card {
            width: 330px !important; /* Slightly smaller than envelope width */
            height: 180px !important; /* Slightly smaller than envelope height */
        }

        .envelope-wrapper {
            /* Adjust scale to fit the new rectangular shape on screen */
            transform: scale(0.65) translateY(40px); 
        }
    }
</style>
</head>
<body>

    <div class="envelope-wrapper" id="envelopeWrapper">
        
        <!-- Invitation Card -->
        <div class="invitation-card">
            <div class="avatar-circle">
                <img src="heart.png" alt="♥" style="width: 30px; height: 30px;" onerror="this.src='https://cdn-icons-png.flaticon.com/512/833/833472.png'">
            </div>

            <h1 class="name">ISMAIL</h1>
            <span class="and-text">&</span>
            <h1 class="name">YARA</h1>

            <div class="elegant-line"></div>
            <p class="wedding-date">September 04, 2026</p>
            <p class="invite-text">cordially invite.</p>

            <a href="details.html" class="open-btn">Open</a>
        </div>

        <!-- 3D Envelope Base -->
        <div class="envelope">
            <div class="flap"></div>
            <div class="pocket"></div>
            <div class="wax-seal" id="waxSeal">
                <span style="font-size: 22px; color: white;">♥</span>
            </div>
        </div>

    </div>

    <script>
        const waxSeal = document.getElementById('waxSeal');
        const envelopeWrapper = document.getElementById('envelopeWrapper');

        // Toggle Open State
        waxSeal.addEventListener('click', (e) => {
            e.stopPropagation();
            envelopeWrapper.classList.add('open');
        });

        // Prompt for guest name
        window.addEventListener('load', () => {
            let guestName = localStorage.getItem('wedding_guest_name');
            if (!guestName) {
                guestName = prompt("Please enter your name to view the invitation:");
                if (guestName && guestName.trim() !== "") {
                    localStorage.setItem('wedding_guest_name', guestName);
                }
            }
        });
    </script>
</body>
</html>
