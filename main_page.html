<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wedding Invitation - Ismail & Yara</title>
    
    <!-- Link to your 3D animations -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* 1. GLOBAL LAYOUT */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { overflow: hidden; width: 100%; height: 100%; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: #fdfaf3;
            animation: fadeInPage 1.2s ease-in-out;
        }

        /* 2. BACKGROUND LOGIC (PC Version) */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("background.png");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: -1;
        }

        /* 3. ENVELOPE BASE (PC) */
        .envelope-wrapper {
            position: relative;
            cursor: pointer;
            z-index: 10;
            transform: scale(0.85); /* PC Size */
            transition: transform 0.3s ease;
        }

        /* 4. MOBILE TRANSFORMATION (Rectangle Shape) */
        @media screen and (max-width: 768px) {
            body::before {
                background-image: url("mobile-background.png") !important;
                background-position: center top !important;
            }

            /* RECTANGLE GEOMETRY */
            .envelope {
                width: 360px !important;   /* Wide */
                height: 180px !important;  /* Short */
            }

            /* Border Math: Width/2 = 180 */
            .flap {
                border-left: 180px solid transparent !important;
                border-right: 180px solid transparent !important;
                border-top: 100px solid #242f3f !important; /* Deep Navy flap */
            }

            .pocket {
                border-left: 180px solid #2c3e50 !important;
                border-right: 180px solid #2c3e50 !important;
                border-bottom: 90px solid #1a252f !important;
                border-top: 90px solid transparent !important;
            }

            /* THE CARD INSIDE (Fits the new rectangle) */
            .invitation-card {
                width: 340px !important;
                height: 170px !important;
                padding: 15px !important;
            }

            /* Adjust card content fonts for rectangle shape */
            .invitation-card .name { font-size: 24px !important; margin: 2px 0 !important; }
            .invitation-card .and-text { font-size: 14px !important; }
            .invitation-card .wedding-date { font-size: 11px !important; margin-top: 5px !important; }
            .invitation-card .invite-text { font-size: 10px !important; }
            .invitation-card .avatar-circle { width: 35px !important; height: 35px !important; margin-bottom: 5px !important; }
            .invitation-card .open-btn { padding: 6px 20px !important; font-size: 10px !important; margin-top: 10px !important; }

            /* THE WAX SEAL */
            .wax-seal {
                left: 50% !important;
                transform: translateX(-50%) !important;
                bottom: 75px !important; /* Locks to the flap point */
            }

            .envelope-wrapper {
                transform: scale(0.65) translateY(40px); /* Fits comfortably on iPhone/Android */
            }
        }

        @keyframes fadeInPage { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="envelope-wrapper" id="envelopeWrapper">
        
        <!-- Invitation Card -->
        <div class="invitation-card">
            <div class="avatar-circle">
                <img src="heart.png" alt="♥" style="width: 30px; height: 30px;" onerror="this.src='https://cdn-icons-png.flaticon.com/512/833/833472.png'">
            </div>

            <h1 class="name">ISMAIL</h1>
            <span class="and-text">&</span>
            <h1 class="name">YARA</h1>

            <div class="elegant-line"></div>
            <p class="wedding-date">September 04, 2026</p>
            <p class="invite-text">cordially invite.</p>

            <a href="details.html" class="open-btn">Open</a>
        </div>

        <!-- 3D Envelope Base -->
        <div class="envelope">
            <div class="flap"></div>
            <div class="pocket"></div>
            <div class="wax-seal" id="waxSeal">
                <span style="font-size: 22px; color: white;">♥</span>
            </div>
        </div>

    </div>

    <script>
        const waxSeal = document.getElementById('waxSeal');
        const envelopeWrapper = document.getElementById('envelopeWrapper');

        // Toggle Open State
        waxSeal.addEventListener('click', (e) => {
            e.stopPropagation();
            envelopeWrapper.classList.add('open');
        });

        // Prompt for guest name
        window.addEventListener('load', () => {
            let guestName = localStorage.getItem('wedding_guest_name');
            if (!guestName) {
                guestName = prompt("Please enter your name to view the invitation:");
                if (guestName && guestName.trim() !== "") {
                    localStorage.setItem('wedding_guest_name', guestName);
                }
            }
        });
    </script>
</body>
</html>
